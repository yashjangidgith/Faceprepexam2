<!DOCTYPE html>
<html>
<head>
    <title>Bill Splitter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #999;
            border-radius: 4px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            background-color: #292e32;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }

        #result {
            margin-top: 20px;
            padding: 12px;
            background-color: #eeeeee;
            border-radius: 5px;
            line-height: 2;
            color: #333;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Bill Splitter</h2>

        <label>Bill amount (Rs.)</label>
        <input type="number" id="bill" placeholder="e.g. 1200">

        <label>Tip</label>
        <select id="tip">
            <option value="0">0%</option>
            <option value="5">5%</option>
            <option value="10" selected>10%</option>
            <option value="15">15%</option>
        </select>

        <label>Number of people</label>
        <input type="number" id="people" value="1">

        <button id="calculate">Calculate</button>

        <div id="result"></div>

    </div>

    <script>

        document.getElementById("calculate").addEventListener("click", function() {

            // Get input values
            let bill = parseFloat(document.getElementById("bill").value);
            let tip = parseFloat(document.getElementById("tip").value);
            let people = parseInt(document.getElementById("people").value);

            let result = document.getElementById("result");

            // Input validation
            if (
                document.getElementById("bill").value.trim() === "" ||
                !Number.isFinite(bill) ||
                bill <= 0 ||
                document.getElementById("people").value.trim() === "" ||
                !Number.isInteger(people) ||
                people < 1
            ) {
                result.innerHTML =
                    '<span class="error">Please enter a valid bill and number of people.</span>';
                return;
            }

            // Calculate tip
            let tipAmount = bill * tip / 100;

            // Calculate total bill
            let totalBill = bill + tipAmount;

            // Calculate per person amount
            let eachPerson = totalBill / people;

            // Display result
            result.innerHTML =
                "Tip amount: Rs. " + tipAmount.toFixed(2) + "<br>" +
                "Total bill: Rs. " + totalBill.toFixed(2) + "<br>" +
                "Each person pays: Rs. " + eachPerson.toFixed(2);

        });

    </script>

</body>
</html>
